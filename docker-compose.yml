services:
  app:
    build: .
    restart: always
    env_file: .env
    volumes: [ "data:/app/data", "uploads:/app/uploads" ]
    depends_on: [ clamav ]
  clamav:
    image: clamav/clamav:stable
    restart: always
    volumes: [ "clamdb:/var/lib/clamav" ]
  caddy:
    image: caddy:2
    restart: always
    ports: [ "80:80", "443:443" ]
    environment: [ "DOMAIN=${DOMAIN}" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile", "caddy:/data" ]
    depends_on: [ app ]
volumes: { data: {}, uploads: {}, clamdb: {}, caddy: {} }
