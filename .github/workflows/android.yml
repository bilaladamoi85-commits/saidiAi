name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: [ "mobile/**", ".github/workflows/android.yml" ]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Set the site address
        working-directory: mobile
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "Add a repository variable named APP_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url=process.env.APP_URL;c.server.cleartext=process.env.APP_URL.startsWith('http://');require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cloudplay-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          
